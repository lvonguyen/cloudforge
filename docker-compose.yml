version: '3.8'

services:
  # Cloud Aegis API server
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GRC_PROVIDER=postgres
      # [!] Production: set POSTGRES_PASSWORD via .env or secret manager
      - DATABASE_URL=postgres://aegis:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aegis?sslmode=prefer
      - OPA_URL=http://opa:8181
      - APP_ENV=production
      - AEGIS_TRACING_ENABLED=true
      - AEGIS_OTLP_ENDPOINT=jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: aegis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Open Policy Agent
  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"  # listens inside container; host binding is localhost-only above
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./policies:/policies:ro

  # Temporal server (for workflow orchestration)
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=aegis
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # Jaeger — distributed tracing backend (OTLP-native)
  jaeger:
    image: jaegertracing/jaeger:2
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI (localhost only)
      - "4317"                    # OTLP gRPC (internal network only)
      - "4318"                    # OTLP HTTP (internal network only)
    restart: unless-stopped

volumes:
  postgres_data:
