[package]
name = "aegispath"
version = "0.1.0"
edition = "2024"
description = "Rust hot-path library for Cloud Aegis attack path computation"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "attackpath_bench"
harness = false
