run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - errcheck
    - exhaustive
    - goconst
    - gocritic
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unused

linters-settings:
  errcheck:
    check-type-assertions: false  # sync.Map type assertions are always safe in our code
    check-blank: false  # Allow _ = foo() for intentionally ignored errors
    exclude-functions:
      - (io.Closer).Close
      - (net/http.ResponseWriter).Write
      - (*encoding/json.Encoder).Encode
      - (*database/sql.Tx).Rollback
      - (*go.uber.org/zap.Logger).Sync

  goconst:
    min-len: 5
    min-occurrences: 7  # Increased threshold to reduce noise

  gocritic:
    enabled-tags:
      - diagnostic
    disabled-checks:
      - appendAssign       # False positive for append to different slice
      - ifElseChain        # Style preference
      - elseif             # Style preference
      - sprintfQuotedString # Style preference
      - builtinShadowDecl  # min/max shadowing common in pre-1.21 code
      - exitAfterDefer     # Intentional pattern in main.go

  goimports:
    local-prefixes: github.com/yourusername/cloudforge

  gosec:
    excludes:
      - G101  # False positive on constant names containing "credential"
      - G104  # Audit errors not checked (handled by errcheck)
      - G204  # Subprocess with variable args (sanitized in code)
      - G304  # File path provided as taint input (intentional in some cases)

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Too noisy for minimal benefit
      - shadow          # err shadowing is common and intentional

  nakedret:
    max-func-lines: 30

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code

issues:
  exclude-rules:
    # Exclude test files from some linters
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - goconst

    # Exclude generated files
    - path: \.pb\.go
      linters:
        - all

    # Allow longer functions in main
    - path: cmd/
      linters:
        - funlen

  max-issues-per-linter: 50
  max-same-issues: 10
