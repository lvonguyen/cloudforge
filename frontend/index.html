<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cloud Aegis - Cloud Security Posture Management Platform" />
    <meta property="og:title" content="Cloud Aegis — Cloud Security Platform" />
    <meta property="og:description" content="Enterprise cloud security platform — policy-as-code provisioning, AI-powered risk scoring, and multi-cloud compliance." />
    <meta property="og:type" content="website" />
    <title>Cloud Aegis — Cloud Security Platform</title>
    <script>
      // Anti-flash: set dark class before render
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- App shell skeleton — renders before JS loads, becomes LCP element.
           React.createRoot replaces this entirely on hydration. -->
      <div style="display:flex;height:100vh;background:#0a0a0a;color:#a3a3a3;font-family:system-ui,-apple-system,sans-serif;font-size:14px">
        <nav style="width:220px;border-right:1px solid #1e2330;padding:16px;flex-shrink:0">
          <div style="font-size:15px;font-weight:600;color:#e5e7eb;margin-bottom:24px">Cloud Aegis</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="height:10px;width:80%;background:#1e2330;border-radius:2px"></div>
            <div style="height:10px;width:60%;background:#1e2330;border-radius:2px"></div>
            <div style="height:10px;width:70%;background:#1e2330;border-radius:2px"></div>
            <div style="height:10px;width:50%;background:#1e2330;border-radius:2px"></div>
          </div>
        </nav>
        <main style="flex:1;padding:24px">
          <div style="height:14px;width:200px;background:#1e2330;border-radius:2px;margin-bottom:16px"></div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
            <div style="height:80px;background:#111318;border:1px solid #1e2330;border-radius:4px"></div>
            <div style="height:80px;background:#111318;border:1px solid #1e2330;border-radius:4px"></div>
            <div style="height:80px;background:#111318;border:1px solid #1e2330;border-radius:4px"></div>
            <div style="height:80px;background:#111318;border:1px solid #1e2330;border-radius:4px"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
