<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Magnifying glass circle -->
  <circle cx="27" cy="27" r="16" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Magnifying glass handle -->
  <line x1="38" y1="38" x2="56" y2="56"
        stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <!-- Crosshair horizontal -->
  <line x1="14" y1="27" x2="40" y2="27"
        stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
  <!-- Crosshair vertical -->
  <line x1="27" y1="14" x2="27" y2="40"
        stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
  <!-- Crosshair inner circle -->
  <circle cx="27" cy="27" r="6" stroke="#991b1b" stroke-width="1.5"/>
  <!-- Alert dot (top-right) -->
  <circle cx="50" cy="14" r="7" fill="#dc2626"/>
  <text x="50" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="white">!</text>
</svg>
