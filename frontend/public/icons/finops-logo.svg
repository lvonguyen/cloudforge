<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Chart bars -->
  <rect x="8" y="38" width="8" height="16" rx="1.5" fill="#d97706"/>
  <rect x="20" y="28" width="8" height="26" rx="1.5" fill="#d97706"/>
  <rect x="32" y="18" width="8" height="36" rx="1.5" fill="#d97706"/>
  <rect x="44" y="24" width="8" height="30" rx="1.5" fill="#d97706"/>
  <!-- Trend line over bars -->
  <polyline points="12,36 24,24 36,14 48,20"
            stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Trend arrow head -->
  <polyline points="44,18 48,20 46,24"
            stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Dollar sign circle -->
  <circle cx="52" cy="12" r="9" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <text x="52" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">$</text>
  <!-- Baseline -->
  <line x1="6" y1="56" x2="58" y2="56" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
</svg>
