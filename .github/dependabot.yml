# Auto-generated by shared/ci-templates/dependabot/deploy.sh
# Merges grouping (clopusgotchi pattern) + labels/prefixes (org pattern)
# Schedule: weekly Monday, minor+patch grouped, 5 PR limit
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "lvonguyen"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "lvonguyen"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    ignore:
      # Temporary: Dependabot's github-actions updater is currently erroring on
      # this action even when the rest of the batch succeeds, which turns the
      # weekly update run red and adds noise to CI triage.
      - dependency-name: "goreleaser/goreleaser-action"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "lvonguyen"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "lvonguyen"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "lvonguyen"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Hold ESLint major bumps until eslint-plugin-react-hooks supports them.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
