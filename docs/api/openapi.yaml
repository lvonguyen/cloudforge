  /api/v1/ai/nlq:
    post:
      operationId: queryNLQ
      summary: Natural language query to structured filters
      description: "RBAC: operator, admin. Scope-guarded. Rate-limited to ~20 req/min per user."
      tags: [AI/NLQ]
      x-rbac: [operator, admin]
      requestBody:
        required: true
