          application/json:
            schema:
              type: object
              required: [org_name]
              properties:
                org_name:
                  type: string
      responses:
        "200":
          description: Org scan result
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/secrets/{path}:
    get:
      operationId: getSecret
      summary: Get secret metadata (value never exposed)
      description: "RBAC: viewer, operator, admin. Scope-guarded. Wildcard path segment."
      tags: [Secrets]
      x-rbac: [viewer, operator, admin]
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret metadata (no value)
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  version:
                    type: string
                  metadata:
                    type: object
                  created:
                    type: string
                  updated:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

