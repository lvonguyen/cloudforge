                query:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Parsed structured filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NLQResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
