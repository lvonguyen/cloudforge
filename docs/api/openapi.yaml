            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/secrets/upload:
    post:
      operationId: uploadSuspectedSecret
      summary: Upload suspected secret for ephemeral analysis
      description: "RBAC: operator, admin. Scope-guarded. TLS required. Content is never persisted."
      tags: [Secrets]
      x-rbac: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret_type, content]
              properties:
                secret_type:
                  type: string
                  enum:
                    - api_token
                    - ssh_keypair
                    - oauth_secret
                    - aws_access_key
                    - azure_spn
                    - gcp_sa_key
                    - generic_password
                    - certificate_pem
                content:
                  type: string
                  maxLength: 65536
      responses:
        "200":
          description: Ephemeral scan result
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret_type:
                    type: string
                  findings:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
                  ephemeral:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: TLS required
        "413":
          description: Content exceeds 64KB limit

  /api/v1/secrets/org-scan:
    post:
      operationId: orgSecretsScan
      summary: Org-wide secrets scan
      description: "RBAC: admin only."
