<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500">
  <defs>
    <style>
      .title { font-family: Georgia, serif; font-size: 22px; font-weight: bold; fill: #1a365d; }
      .step-num { font-family: Georgia, serif; font-size: 14px; font-weight: bold; fill: white; }
      .step-label { font-family: Georgia, serif; font-size: 10px; fill: #2d3748; }
      .box-label { font-family: Georgia, serif; font-size: 10px; font-weight: bold; fill: white; }
      .phase-label { font-family: Georgia, serif; font-size: 11px; font-weight: bold; fill: #4a5568; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  
  <text x="550" y="35" text-anchor="middle" class="title">Diagram 2: Monthly Report Data Flow</text>
  
  <!-- Phase Labels -->
  <text x="130" y="65" text-anchor="middle" class="phase-label">TRIGGER</text>
  <text x="380" y="65" text-anchor="middle" class="phase-label">QUERY</text>
  <text x="620" y="65" text-anchor="middle" class="phase-label">PROCESS</text>
  <text x="900" y="65" text-anchor="middle" class="phase-label">OUTPUT</text>
  
  <line x1="250" y1="55" x2="250" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="55" x2="500" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="750" y1="55" x2="750" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Step 1 -->
  <circle cx="130" cy="130" r="25" fill="#1e40af"/>
  <text x="130" y="135" text-anchor="middle" class="step-num">1</text>
  <text x="130" y="175" text-anchor="middle" class="step-label">Logic App Trigger</text>
  <text x="130" y="190" text-anchor="middle" class="step-label">1st @ 8:00 AM PST</text>
  
  <!-- Step 2a-c -->
  <circle cx="330" cy="100" r="22" fill="#3b82f6"/>
  <text x="330" y="105" text-anchor="middle" class="step-num">2a</text>
  <rect x="285" y="128" width="90" height="35" rx="5" fill="#3b82f6"/>
  <text x="330" y="150" text-anchor="middle" class="box-label">Azure Query</text>
  
  <circle cx="430" cy="100" r="22" fill="#f59e0b"/>
  <text x="430" y="105" text-anchor="middle" class="step-num">2b</text>
  <rect x="385" y="128" width="90" height="35" rx="5" fill="#f59e0b"/>
  <text x="430" y="150" text-anchor="middle" class="box-label">AWS Query</text>
  
  <circle cx="380" cy="200" r="22" fill="#22c55e"/>
  <text x="380" y="205" text-anchor="middle" class="step-num">2c</text>
  <rect x="335" y="228" width="90" height="35" rx="5" fill="#22c55e"/>
  <text x="380" y="250" text-anchor="middle" class="box-label">GCP Query</text>
  
  <!-- Steps 3-4 -->
  <circle cx="570" cy="130" r="22" fill="#8b5cf6"/>
  <text x="570" y="135" text-anchor="middle" class="step-num">3</text>
  <rect x="525" y="158" width="90" height="45" rx="5" fill="#8b5cf6"/>
  <text x="570" y="178" text-anchor="middle" class="box-label">Normalize</text>
  <text x="570" y="192" text-anchor="middle" class="box-label" style="font-size: 8px;">CBU/Tier/Env</text>
  
  <circle cx="670" cy="130" r="22" fill="#a855f7"/>
  <text x="670" y="135" text-anchor="middle" class="step-num">4</text>
  <rect x="625" y="158" width="90" height="45" rx="5" fill="#a855f7"/>
  <text x="670" y="178" text-anchor="middle" class="box-label">Deduplicate</text>
  <text x="670" y="192" text-anchor="middle" class="box-label" style="font-size: 8px;">FindingIdShort</text>
  
  <!-- Steps 5-8 -->
  <circle cx="820" cy="90" r="22" fill="#6366f1"/>
  <text x="820" y="95" text-anchor="middle" class="step-num">5</text>
  <rect x="775" y="118" width="90" height="35" rx="5" fill="#6366f1"/>
  <text x="820" y="140" text-anchor="middle" class="box-label">Asana Sync</text>
  
  <circle cx="920" cy="90" r="22" fill="#ec4899"/>
  <text x="920" y="95" text-anchor="middle" class="step-num">6</text>
  <rect x="875" y="118" width="90" height="35" rx="5" fill="#ec4899"/>
  <text x="920" y="140" text-anchor="middle" class="box-label">Gen Report</text>
  
  <circle cx="870" cy="190" r="22" fill="#f43f5e"/>
  <text x="870" y="195" text-anchor="middle" class="step-num">7</text>
  <rect x="825" y="218" width="90" height="35" rx="5" fill="#f43f5e"/>
  <text x="870" y="240" text-anchor="middle" class="box-label">Send Email</text>
  
  <circle cx="970" cy="190" r="22" fill="#64748b"/>
  <text x="970" y="195" text-anchor="middle" class="step-num">8</text>
  <rect x="925" y="218" width="90" height="35" rx="5" fill="#64748b"/>
  <text x="970" y="240" text-anchor="middle" class="box-label">Remediation</text>
  
  <!-- Arrows -->
  <line x1="155" y1="130" x2="280" y2="110" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="155" y1="130" x2="380" y2="110" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="155" y1="145" x2="355" y2="190" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="375" y1="155" x2="520" y2="170" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="155" x2="520" y2="170" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405" y1="228" x2="520" y2="185" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="615" y1="175" x2="620" y2="175" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="165" x2="770" y2="135" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="185" x2="870" y2="125" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="920" y1="153" x2="890" y2="185" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="153" x2="950" y2="185" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Annotations -->
  <rect x="50" y="290" width="200" height="100" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="150" y="312" text-anchor="middle" class="phase-label">Query Filters</text>
  <text x="60" y="335" class="step-label">Critical/High/Medium severity</text>
  <text x="60" y="352" class="step-label">GA findings only (no preview)</text>
  <text x="60" y="369" class="step-label">All CBUs in scope</text>
  <text x="60" y="386" class="step-label">All cloud accounts</text>
  
  <rect x="780" y="290" width="220" height="115" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="890" y="312" text-anchor="middle" class="phase-label">Email Recipients</text>
  <text x="790" y="335" class="step-label">InfoSec DL (monthly summary)</text>
  <text x="790" y="352" class="step-label">haea-aws-securityops@haeaus.com</text>
  <text x="790" y="369" class="step-label">haea-azure-securityops@haeaus.com</text>
  <text x="790" y="386" class="step-label">haea-gcp-securityops@haeaus.com</text>
  <text x="790" y="403" class="step-label">App/Dev Teams (direct PoCs)</text>
</svg>