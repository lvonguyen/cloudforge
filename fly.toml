app = "cloudforge-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  GRC_PROVIDER = "memory"
  APP_ENV = "production"
  RATE_LIMIT_ENABLED = "true"
  CORS_ALLOWED_ORIGINS = "https://cloudforge-demo.lvonguyen.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
